<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Transform with AI</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--paper:#F3F5F7;--ink:#0F1B2D;--accent:#1F4FD8}
@media (prefers-color-scheme:dark){:root{--paper:#0D1520;--ink:#E8EDF3;--accent:#8FADFF}}
body{margin:0;min-height:100vh;display:grid;place-content:center;padding:1rem;background:var(--paper);color:var(--ink);font:1.0625rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1{font-size:clamp(2rem,6vw,3.5rem);letter-spacing:-.03em;margin:0 0 .5rem}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>That page does not exist.</h1>
<p><a href="/">Go to the home page</a></p>
</main>
</body>
</html>
