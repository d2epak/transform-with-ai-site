<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Transform with AI</title>
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<style>
:root{--paper:#F4F5F5;--ink:#12161C;--amber:#FFB000}
@media (prefers-color-scheme:dark){:root{--paper:#0E1116;--ink:#ECEFF3}}
body{margin:0;min-height:100vh;display:grid;place-content:center;padding:1rem;background:var(--paper);color:var(--ink);font:1.0625rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1{font-size:clamp(2.2rem,8vw,4rem);letter-spacing:-.04em;line-height:1;margin:0 0 1rem;font-weight:800}
a{color:var(--ink);text-decoration-color:var(--amber);text-decoration-thickness:.12em;text-underline-offset:.2em}
a:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>That page does not exist.</h1>
<p><a href="/">Go to the home page</a></p>
</main>
</body>
</html>
